name: Build APK

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'webos/**'
      - 'brand/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Prepare APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk KoalaTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KoalaTV-${{ env.VERSION }}
          path: KoalaTV.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: KoalaTV ${{ env.VERSION }}
          files: KoalaTV.apk
          make_latest: true

      # Résultat de la compilation (et erreurs) sur la branche build-logs, lisible sans accès à l'onglet Actions
      - name: Report
        if: always()
        run: |
          RESULT="${{ job.status }}"
          mkdir -p /tmp/report
          echo "$RESULT ${GITHUB_SHA}" > /tmp/report/status.txt
          if [ -f build.log ]; then
            grep -E "^e: |error:|FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)|\.kt:[0-9]+|\.xml:[0-9]+|AAPT|Could not" build.log | head -200 > /tmp/report/errors.txt || true
            tail -150 build.log > /tmp/report/tail.txt
          fi
          DB="https://koalatv-dae7b-default-rtdb.europe-west1.firebasedatabase.app"
          {
            echo "ecriture: $(curl -s -m 20 -X PUT -d '{"at":1}' "$DB/h/ci-check/e/ping.json")"
            echo "lecture: $(curl -s -m 20 "$DB/h/ci-check/e.json")"
            echo "liste racine (doit etre refusee): $(curl -s -m 20 "$DB/h.json")"
            echo "ecriture facon TV LG: $(curl -s -m 20 -X POST -H 'Content-Type: text/plain' -d '{"at":2}' "$DB/h/ci-check/e/tv.json?x-http-method-override=PUT")"
            echo "lecture apres TV: $(curl -s -m 20 "$DB/h/ci-check/e.json")"
            echo "CORS: $(curl -s -m 20 -I -H 'Origin: null' "$DB/h/ci-check/e.json" | grep -i access-control-allow-origin)"
            echo "nettoyage: $(curl -s -m 20 -X DELETE "$DB/h/ci-check.json")"
          } > /tmp/report/firebase.txt 2>&1 || true
          cd /tmp/report
          git init -q -b build-logs
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "$RESULT ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
