<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KoalaTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="s-login" class="screen">
    <div class="login">
      <div class="brand big"><img src="koala.png" alt=""><span>Koala<b>TV</b></span></div>
      <label class="field" data-i="0">
        <span class="lbl">Serveur ou lien M3U</span>
        <input id="l-server" type="text" placeholder="http://serveur.com:8080" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field" data-i="1">
        <span class="lbl">Identifiant</span>
        <input id="l-user" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field" data-i="2">
        <span class="lbl">Mot de passe</span>
        <input id="l-pass" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div class="btn" data-i="3">Se connecter</div>
      <div id="l-status"></div>
    </div>
  </section>

  <section id="s-home" class="screen">
    <header class="top">
      <div class="brand"><img src="koala.png" alt=""><span>Koala<b>TV</b></span></div>
      <div id="h-account"></div>
    </header>
    <div id="h-resume">
      <div class="h-label">Reprendre</div>
      <div class="h-clip"><div id="h-row"></div></div>
    </div>
    <div class="tiles">
      <div class="tile" data-i="0">
        <img src="tile_live.png" alt="">
        <span>TV en direct</span>
      </div>
      <div class="tile" data-i="1">
        <img src="tile_movies.png" alt="">
        <span>Films</span>
      </div>
      <div class="tile" data-i="2">
        <img src="tile_series.png" alt="">
        <span>Séries</span>
      </div>
      <div class="tile" data-i="3">
        <img src="tile_settings.png" alt="">
        <span>Réglages</span>
      </div>
    </div>
  </section>

  <section id="s-browse" class="screen">
    <aside class="side">
      <h1 id="b-title"></h1>
      <label class="search" id="b-search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="b-search" type="text" placeholder="Rechercher" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div id="b-cats" class="vlist"></div>
    </aside>
    <main class="main">
      <div class="head"><span id="b-head"></span><span id="b-count"></span><span id="b-guide" class="hbtn">Guide TV</span></div>
      <div id="b-items" class="vlist"></div>
      <div id="b-msg" class="msg"></div>
    </main>
  </section>

  <section id="s-series" class="screen">
    <aside class="side">
      <div class="cover"><img id="sr-cover" alt=""></div>
      <h1 id="sr-title"></h1>
      <div id="sr-seasons" class="vlist"></div>
    </aside>
    <main class="main">
      <div class="head"><span id="sr-head"></span><span id="sr-count"></span></div>
      <div id="sr-eps" class="vlist"></div>
      <div id="sr-msg" class="msg"></div>
    </main>
  </section>

  <section id="s-guide" class="screen">
    <div class="g-info">
      <div class="g-top"><h1 id="g-title"></h1><span id="g-clock"></span></div>
      <div id="g-when"></div>
      <div id="g-desc"></div>
    </div>
    <div class="g-rule"><span id="g-day"></span><div id="g-ruler"></div></div>
    <div id="g-rows"></div>
  </section>

  <section id="s-catset" class="screen">
    <div class="cs-head">
      <h1 id="cs-title"></h1>
      <p>Appuie sur OK pour masquer ou afficher une catégorie.</p>
    </div>
    <div id="cs-list" class="vlist"></div>
  </section>

  <section id="s-movie" class="screen">
    <div id="m-back"></div>
    <div class="m-scrim"></div>
    <div class="m-wrap">
      <div class="m-poster"><img id="m-poster" alt=""></div>
      <div class="m-info">
        <h1 id="m-title"></h1>
        <div id="m-meta"></div>
        <div id="m-genre"></div>
        <div class="m-btns" id="m-btns">
          <div class="mbtn primary" data-b="0" id="m-play">Lecture</div>
          <div class="mbtn" data-b="1" id="m-restart">Depuis le début</div>
          <div class="mbtn icon" data-b="2" id="m-fav"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.36l-5.7 3 1.09-6.35-4.62-4.5 6.38-.93z"/></svg></div>
        </div>
        <p id="m-plot"></p>
        <p id="m-credits"></p>
      </div>
    </div>
  </section>

  <section id="s-player" class="screen">
    <video id="video" preload="auto"></video>
    <div id="p-info">
      <div class="p-row">
        <div id="p-title"></div>
        <div id="p-pos"></div>
      </div>
      <div id="p-epg"></div>
      <div id="p-vod">
        <div class="bar"><div id="p-prog"></div></div>
        <div class="times"><span id="p-cur"></span><span id="p-dur"></span></div>
      </div>
    </div>
    <div id="p-status"></div>
    <div id="p-num"></div>
    <div id="p-pause"><svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg></div>
  </section>

  <div id="spinner"></div>

  <div id="dialog">
    <div class="dlg">
      <h2 id="d-title"></h2>
      <p id="d-msg"></p>
      <div id="d-opts"></div>
    </div>
  </div>

  <div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
